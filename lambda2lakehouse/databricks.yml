# This is a Databricks asset bundle definition for lambda2lakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lambda2lakehouse
  uuid: 191e8580-0495-4845-862d-88d5f346fffd

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog_name:
    default: samples
  env:
    default: dev
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-3ff0dc32-7698.cloud.databricks.com
    variables:
      catalog: samples
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-3ff0dc32-7698.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/tonystark19499@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/tonystark19499@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: samples
      schema: prod
    permissions:
      - user_name: tonystark19499@gmail.com
        level: CAN_MANAGE

resources:
  pipelines:
    iot_dlt_pipeline:
      name: "IoT Sensor Pipeline [${bundle.target}]"
      target: ${var.catalog_name}
      catalog: ${var.catalog_name}
      continuous: true
      channel: CURRENT
      libraries:
        - notebook:
            path: ./src/pipelines/bronze_layer.py
        - notebook:
            path: ./src/pipelines/silver_layer.py
        - notebook:
            path: ./src/pipelines/gold_layer.py
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 1
            mode: ENHANCED